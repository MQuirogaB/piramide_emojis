name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -e ".[dev,yaml]"

      - name: Ejecutar tests
        run: pytest -v

      - name: Generar ejemplo (pirámide con carita)
        run: |
          piramide-emoji --config examples/carita.yaml -o piramide-carita.stl

      - name: Publicar el STL como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: piramide-carita-stl
          path: piramide-carita.stl
