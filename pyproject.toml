[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piramide-emoji"
version = "0.1.0"
description = "Generador paramétrico de pirámides truncadas en 3D con agujero para tornillo M3 y emojis grabados en las caras, listas para imprimir."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Miguel Quiroga" }]
dependencies = [
    "trimesh>=4.0",
    "manifold3d>=3.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "cairosvg>=2.7",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
piramide-emoji = "piramide_emoji.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
